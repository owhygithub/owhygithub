<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>

  <!-- graph motif, right side -->
  <g stroke="url(#edge)" stroke-width="1.5" fill="none">
    <line x1="760" y1="70" x2="880" y2="130"/>
    <line x1="880" y1="130" x2="1010" y2="60"/>
    <line x1="880" y1="130" x2="960" y2="210"/>
    <line x1="1010" y1="60" x2="1120" y2="120"/>
    <line x1="960" y1="210" x2="1120" y2="120"/>
    <line x1="760" y1="70" x2="820" y2="200"/>
    <line x1="820" y1="200" x2="960" y2="210"/>
    <line x1="1010" y1="60" x2="1090" y2="30"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="760" cy="70" r="5" opacity="0.7"/>
    <circle cx="880" cy="130" r="8"/>
    <circle cx="1010" cy="60" r="6" opacity="0.8"/>
    <circle cx="960" cy="210" r="6" opacity="0.8"/>
    <circle cx="1120" cy="120" r="5" opacity="0.7"/>
    <circle cx="820" cy="200" r="4" opacity="0.6"/>
    <circle cx="1090" cy="30" r="3" opacity="0.5"/>
  </g>
  <g fill="#f78166">
    <circle cx="880" cy="130" r="3"/>
  </g>

  <!-- text -->
  <text x="64" y="118" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e6edf3">Oskar Wang</text>
  <text x="66" y="160" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">ML and LLM systems. Graphs, retrieval, and financial time series.</text>
  <text x="66" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#58a6ff">Associate Data Scientist @ Simon-Kucher  ·  MSc AI, VU Amsterdam  ·  ex-Adyen</text>
